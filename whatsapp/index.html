<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Encaminhando para o WhatsApp | Goularte Gás e Água</title>
  <meta name="description" content="Estamos encaminhando seu atendimento para o WhatsApp da Goularte Gás e Água.">
  <style>
    :root {
      --navy: #08254a;
      --red: #d82435;
      --red-dark: #b71928;
      --gold: #f7c948;
      --ice: #f4f7fb;
      --text: #142033;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--ice);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(8, 37, 74, .12);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: var(--navy);
      color: var(--gold);
      font-size: 34px;
    }
    h1 { margin: 0; color: var(--navy); font-size: clamp(28px, 6vw, 40px); line-height: 1.08; }
    p { margin: 16px auto 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .loader {
      width: 36px;
      height: 36px;
      margin: 24px auto;
      border: 4px solid #e4e9f2;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .button {
      display: inline-flex;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }
    .button:hover { background: var(--red-dark); transform: translateY(-1px); }
    small { display: block; margin-top: 16px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11402683046"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'AW-11402683046');
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">💬</div>
    <h1>Estamos abrindo o WhatsApp</h1>
    <p>Em instantes, você poderá concluir seu pedido com a equipe da Goularte.</p>
    <div class="loader" aria-hidden="true"></div>
    <a class="button" id="whatsapp-link" href="https://wa.me/5551984298427">Continuar para o WhatsApp</a>
    <small>Se o aplicativo não abrir automaticamente, toque no botão acima.</small>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const message = params.get('text') || 'Olá! Quero fazer um pedido na Goularte.';
      const origin = params.get('origem') || 'nao_informada';
      const whatsappUrl = 'https://wa.me/5551984298427?text=' + encodeURIComponent(message);
      const button = document.getElementById('whatsapp-link');
      button.href = whatsappUrl;

      gtag('event', 'whatsapp_redirect', {
        event_category: 'contato',
        event_label: origin,
        transport_type: 'beacon'
      });

      window.setTimeout(function () {
        window.location.replace(whatsappUrl);
      }, 1200);
    }());
  </script>
</body>
</html>
